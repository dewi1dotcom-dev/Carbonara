x-app-env: &app-env
  DATABASE_URL: postgresql://carbonara:${POSTGRES_PASSWORD:-carbonara}@db:5432/carbonara
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-30}
  VEGVESEN_API_KEY: ${VEGVESEN_API_KEY:-}
  VEGVESEN_API_URL: ${VEGVESEN_API_URL:-https://akfell-datautlevering.atlas.vegvesen.no/enkeltoppslag/kjoretoydata}
  VEGVESEN_AUTH_HEADER: ${VEGVESEN_AUTH_HEADER:-SVV-Authorization}
  VEGVESEN_AUTH_SCHEME: ${VEGVESEN_AUTH_SCHEME:-Apikey}
  VEGVESEN_SYNC_DAYS: ${VEGVESEN_SYNC_DAYS:-7}
  TRASH_DAYS: ${TRASH_DAYS:-30}
  RETENTION_YEARS: ${RETENTION_YEARS:-5}
  PRIVACY_COMPANY: ${PRIVACY_COMPANY:-Moss AutoCenter}
  PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  TZ: Europe/Oslo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbonara
      POSTGRES_USER: carbonara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbonara}
      TZ: Europe/Oslo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonara -d carbonara"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ./data/photos:/data/photos
    ports:
      - "${APP_PORT:-8080}:8000"

  # Keeps Statens vegvesen data fresh for vehicles marked as registered, and
  # once a day applies data retention (needs the photos to delete their files).
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.sync_worker"]
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ./data/photos:/data/photos

volumes:
  pgdata:
