<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Carbonara Sidekick</title>
  <style>
    body { font: 14px/1.4 system-ui, "Segoe UI", sans-serif; width: 360px; margin: 0; padding: 12px 14px; color: #1C1B19; background: #FBF7EC; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 6px 0; }
    .muted { color: #4A4538; font-size: 12px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #E0D6BA; border-radius: 6px; font: inherit; }
    button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #E0D6BA; background: #fff; cursor: pointer; }
    button.primary { background: #F5B800; border-color: #F5B800; color: #1C1B19; font-weight: 600; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .link { border: 0; background: none; padding: 0; color: #7A5A00; text-decoration: underline; cursor: pointer; font-size: 12px; }
    #log { list-style: none; padding: 0; margin: 8px 0 0; max-height: 300px; overflow-y: auto; }
    #log li { padding: 4px 0; border-top: 1px solid #E0D6BA; font-size: 13px; }
    .bad { color: #b91c1c; }
    .good { color: #15803d; }
    .warn { color: #a16207; }
    [hidden] { display: none !important; }
    body:has(#finn:not([hidden])) { width: 420px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; margin: 8px 0; }
    .grid2 label { display: flex; flex-direction: column; font-size: 12px; color: #4A4538; gap: 2px; }
    .grid2 select { padding: 5px; font: inherit; border: 1px solid #E0D6BA; border-radius: 6px; }
    .pics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; max-height: 230px; overflow-y: auto; }
    .pic { position: relative; cursor: pointer; }
    .pic img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 4px; opacity: .45; }
    .pic input { position: absolute; top: 3px; left: 3px; margin: 0; }
    .pic:has(input:checked) img { opacity: 1; outline: 2px solid #F5B800; }
  </style>
</head>
<body>
  <h1 id="title">Carbonara Sidekick</h1>

  <section id="setup" hidden>
    <p id="setupText">Carbonara's address, as you open it in Chrome:</p>
    <input type="text" id="base" placeholder="https://192.168.1.20:8443" spellcheck="false">
    <div class="row"><button class="primary" id="save">Save</button></div>
  </section>

  <section id="finn" hidden>
    <p id="finnIntro">Link this finn.no ad to a car in Carbonara:</p>
    <p class="muted" id="finnAd"></p>
    <select id="finnCar" style="width:100%;padding:6px;font:inherit;border:1px solid #E0D6BA;border-radius:6px"></select>
    <div id="finnNew" hidden>
      <p class="muted" id="newInfo"></p>
      <div class="grid2">
        <label><span id="lReg">Reg. no</span><input type="text" id="nReg" spellcheck="false"></label>
        <label><span id="lVin">VIN</span><input type="text" id="nVin" spellcheck="false"></label>
        <label><span id="lMake">Make</span><input type="text" id="nMake"></label>
        <label><span id="lModel">Model</span><input type="text" id="nModel"></label>
        <label><span id="lYear">Model year</span><input type="text" id="nYear" inputmode="numeric"></label>
        <label><span id="lKm">Mileage (km)</span><input type="text" id="nKm" inputmode="numeric"></label>
        <label><span id="lColor">Colour</span><input type="text" id="nColor"></label>
        <label><span id="lFuel">Fuel</span><input type="text" id="nFuel"></label>
        <label><span id="lCond">New/used</span>
          <select id="nCond"><option value="used" id="oUsed">Used</option><option value="new" id="oNew">New</option></select></label>
      </div>
      <p id="lPhotos">Photos to copy (tick the ones you want):</p>
      <div id="nPhotos" class="pics"></div>
    </div>
    <p><label for="finnPrice" id="finnPriceLabel">Asking price on the ad (kr)</label></p>
    <input type="text" id="finnPrice" inputmode="numeric" autocomplete="off">
    <p class="muted" id="finnPriceNote"></p>
    <div class="row"><button class="primary" id="finnLink">Save</button></div>
    <p id="finnStatus"></p>
  </section>

  <section id="main" hidden>
    <p id="intro" class="muted">Open the dealer portal's campaign search and log in, then press "Check cars". You can close this window; the check continues.</p>
    <label class="row"><input type="checkbox" id="all"> <span id="allText">All cars here, not only those due</span></label>
    <div class="row">
      <button class="primary" id="run">Check cars</button>
      <button class="link" id="change">Change Carbonara address</button>
    </div>
    <p id="status"></p>
    <ul id="log"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
