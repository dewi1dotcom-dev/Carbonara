<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EFE8D4">
  <title>Carbonara</title>
  <!-- Set the theme before the first paint, so a light-theme user never sees a dark flash
       (same logic as applyTheme() in ui.js, which also sets theme-color). -->
  <script>
    (function () {
      var p = 'auto';
      try { p = localStorage.getItem('carbonara.theme') || 'auto'; } catch (e) { /* private mode */ }
      var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#272522' : '#EFE8D4');
    })();
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/svg+xml" href="/img/carbonara-icon.svg">
</head>
<body>
  <header class="topbar">
    <!-- The logo is inline (not an <img>) so its colours follow the theme (--logo-* in
         app.css) and the text uses the bundled Space Grotesk font.
         Source files: img/carbonara-logo-light.svg / -dark.svg. -->
    <a class="brand" href="#/" aria-label="Carbonara" translate="no">
      <svg class="brand-logo" viewBox="0 0 560 128" role="img" aria-hidden="true" focusable="false">
        <rect class="logo-bin" x="12" y="12" width="46" height="46" rx="11"/>
        <rect class="logo-bin" x="70" y="12" width="46" height="46" rx="11"/>
        <rect class="logo-bin" x="12" y="70" width="46" height="46" rx="11"/>
        <circle class="logo-wheel" cx="93" cy="93" r="16.5" fill="none" stroke-width="13"/>
        <text class="logo-text" x="150" y="90" font-size="76" letter-spacing="-1.9"><tspan class="logo-car" font-weight="700">Car</tspan><tspan class="logo-bin" font-weight="400">bonara</tspan></text>
      </svg>
    </a>
    <nav>
      <a href="#/" data-nav="today">Today</a>
      <a href="#/arrivals" data-nav="arrivals">Arrivals</a>
      <a href="#/vehicles" data-nav="vehicles">Vehicles</a>
      <a href="#/storage" data-nav="storage">Storage</a>
      <a href="#/test-drive" data-nav="testdrive">Test drive</a>
      <a href="#/settings" data-nav="settings">Settings</a>
      <a href="#/system" data-nav="system" id="nav-system" hidden>System</a>
    </nav>
    <div class="clock" id="clock" aria-live="off"></div>
    <div class="user-menu" id="user-menu"></div>
  </header>
  <div id="notify" class="no-print"></div>
  <main id="app"></main>
  <footer class="app-footer" id="app-version"></footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
